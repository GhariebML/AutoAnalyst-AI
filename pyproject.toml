[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoanalyst-ai"
version = "0.1.0"
description = "Automated AI-powered data analyst system starter project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AutoAnalyst AI Contributors" }]
license = { text = "MIT" }

[project.scripts]
autoanalyst = "autoanalyst.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "jupyter>=1.0.0",
]
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]
llm = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "backend/tests"]
addopts = "--cov=autoanalyst --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "backend", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
