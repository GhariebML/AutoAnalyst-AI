name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Python checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Basic import check
        run: |
          python -c "import autoanalyst; print(autoanalyst.__version__)"
          python -c "from autoanalyst.data_profiling.profiler import generate_basic_profile"

      - name: Compile Python files
        run: python -m compileall -q app src tests

      - name: Lint (ruff)
        run: ruff check src app tests

      - name: Type check (mypy)
        run: mypy src

      - name: Run tests with coverage gate
        run: pytest
