version: '3.8'

services:
  autoanalyst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoanalyst-ai
    ports:
      - "8501:8501"
    environment:
      - AUTOANALYST_LLM_ENABLED=false
      - AUTOANALYST_LLM_PROVIDER=openai
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./.autoanalyst:/app/.autoanalyst
    restart: unless-stopped
